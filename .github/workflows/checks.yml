name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Fetch and verify pinned platform sources
        run: uv run --locked python -m scripts.fetch_platform
      - name: Check CLI configuration
        run: uv run --locked guandan-agent config-check configs/local.example.toml
      - name: Build pinned Java platform and action worker
        run: uv run --locked python scripts/prepare_platform.py
      - name: Run offline tests
        run: uv run --locked pytest
        env:
          GUANDAN_REQUIRE_JAVA_SMOKE: '1'
      - name: Build Python distributions
        run: uv build
